[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serena-saas-product-analytics"
version = "1.0.0"
description = "Replay-safe event ingestion and SQL product analytics, with optional cloud adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.6,<3"]
snowflake = ["snowflake-connector-python>=3.12,<5"]
spark = ["pyspark>=3.5,<4"]

[project.scripts]
saas-analytics = "saas_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["saas_analytics*"]

[tool.setuptools.package-data]
saas_analytics = ["sql/*.sql"]
